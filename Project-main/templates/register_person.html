    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let capturedPhotos = [];
        let stream = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                document.getElementById('startCameraBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                document.getElementById('stopCameraBtn').disabled = false;
                
                showAlert('Camera started! Position your face in the frame and click Capture Photo', 'info');
            } catch (err) {
                showAlert('Error accessing camera: ' + err.message, 'error');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
                
                document.getElementById('startCameraBtn').disabled = false;
                document.getElementById('captureBtn').disabled = true;
                document.getElementById('stopCameraBtn').disabled = true;
            }
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const photoData = canvas.toDataURL('image/jpeg');
            capturedPhotos.push(photoData);
            
            displayPhotos();
            showAlert(`Photo ${capturedPhotos.length} captured! ${5 - capturedPhotos.length > 0 ? 'Capture ' + (5 - capturedPhotos.length) + ' more for best results' : 'Good to go!'}`, 'success');
        }

        function displayPhotos() {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = '';
            
            capturedPhotos.forEach((photo, index) => {
                const div = document.createElement('div');
                div.className = 'photo-thumbnail';
                div.innerHTML = `
                    <img src="${photo}" alt="Photo ${index + 1}">
                    <button class="remove-btn" onclick="removePhoto(${index})">×</button>
                `;
                gallery.appendChild(div);
            });
        }

        function removePhoto(index) {
            capturedPhotos.splice(index, 1);
            displayPhotos();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (capturedPhotos.length < 3) {
                showAlert('Please capture at least 3 photos for better recognition accuracy', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');

                role: document.getElementById('role').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                photos: capturedPhotos
            };
            
            try {

                    body: JSON.stringify(data)
                });

                if (result.success) {

                    }, 2000);

                }
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Register Person';
            }
        });
