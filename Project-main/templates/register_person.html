<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Person - Face Mask System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f5f5f5; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0056b3; }
        #message { margin-top: 20px; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .preview { margin-top: 10px; max-width: 100%; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>👤 New Registration</h1>
        <p>Register a new person for the Face Mask Recognition system.</p>
        
        <form id="regForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="image">Upload Photo</label>
                <input type="file" id="image" name="image" accept="image/*" required onchange="previewImage(this)">
                <img id="preview" class="preview" src="#" alt="Preview">
            </div>

            <button type="submit">Register Person</button>
        </form>

        <div id="message"></div>
        <p><a href="/">Back to Home</a> | <a href="/attendance">View Attendance</a></p>
    </div>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var p = document.getElementById('preview');
                    p.src = e.target.result;
                    p.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const msgDiv = document.getElementById('message');
            
            try {
                const response = await fetch('/register_user', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    msgDiv.className = 'success';
                    msgDiv.innerText = '✅ ' + result.message;
                    setTimeout(() => {
                        window.location.reload();
                    }, 2000);
                } else {
                    msgDiv.className = 'error';
                    msgDiv.innerText = '❌ ' + (result.error || 'Unknown error');
                }
            } catch (err) {
                msgDiv.className = 'error';
                msgDiv.innerText = '❌ Network Error: ' + err.message;
            }
            msgDiv.style.display = 'block';
        });
    </script>
</body>
</html>
