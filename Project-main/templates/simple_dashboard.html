<!DOCTYPE html>
<html>
<head>
    <title>Simple Mask Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #1a1a2e; color: white; }
        .header { background: #16213e; padding: 20px; text-align: center; }
        .container { max-width: 1400px; margin: 20px auto; padding: 20px; }
        .video-section { background: #0f3460; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        #video { width: 100%; max-width: 800px; border-radius: 10px; display: block; margin: 0 auto; }
        .controls { text-align: center; margin-top: 20px; }
        button { background: #e94560; color: white; border: none; padding: 15px 30px; 
                 font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #c23a4f; }
        button:disabled { background: #666; cursor: not-allowed; }
        .persons-list { background: #0f3460; padding: 20px; border-radius: 10px; }
        .person-card { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .person-card img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; 
                          vertical-align: middle; margin-right: 15px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
                gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #0f3460; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 36px; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 14px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎭 Simple Mask Detection System</h1>
        <p>Detects if people are wearing masks - No complex face recognition</p>
    </div>
    
    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalPersons">0</div>
                <div class="stat-label">Registered Persons</div>
            </div>
        </div>
        
        <div class="video-section">
            <h2>Live Detection</h2>
            <img id="video" src="/video_feed" style="display:none;">
            <div class="controls">
                <button id="startBtn" onclick="startDetection()">▶ Start Detection</button>
                <button id="stopBtn" onclick="stopDetection()" disabled>⏸ Stop Detection</button>
                <button onclick="window.location.href='/register'">➕ Register New Person</button>
            </div>
        </div>
        
        <div class="persons-list">
            <h2>Registered Persons</h2>
            <div id="personsList"></div>
        </div>
    </div>
    
    <script>
        function startDetection() {
            fetch('/start_detection').then(() => {
                document.getElementById('video').style.display = 'block';
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('video').src = '/video_feed?t=' + new Date().getTime();
            });
        }
        
        function stopDetection() {
            fetch('/stop_detection').then(() => {
                document.getElementById('video').style.display = 'none';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
            });
        }
        
        function loadPersons() {
            fetch('/get_all_persons')
                .then(r => r.json())
                .then(persons => {
                    document.getElementById('totalPersons').textContent = persons.length;
                    
                    let html = '';
                    persons.forEach(p => {
                        html += `<div class="person-card">
                            <strong>${p.name}</strong> - ${p.employee_id} - ${p.department} - ${p.role}
                        </div>`;
                    });
                    document.getElementById('personsList').innerHTML = html || '<p>No persons registered</p>';
                });
        }
        
        loadPersons();
        setInterval(loadPersons, 3000);
    </script>
</body>
</html>
